<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify a certificate · Data Practice Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="lnav"><a class="lbrand" href="./"><span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span><b data-site="name">Data Practice Lab</b><small>Certificate verification</small></span></a></header>
<main class="doc">
  <h1>Verify a certificate</h1>
  <p class="meta">Enter the certificate ID printed at the bottom right of the certificate.</p>
  <form id="vf" class="row" style="display:flex;gap:10px;flex-wrap:wrap"><input id="vid" maxlength="20" placeholder="e.g. 7KQ2M9XPLA" style="flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-transform:uppercase" aria-label="Certificate ID"><button class="btn primary" type="submit">Check</button></form>
  <div id="out"></div>
</main>
<script src="js/config.js"></script>
<script type="module">
const cfg = window.SUPABASE_CONFIG || {}, SITE = window.SITE || {};
const configured = /^https:\/\//.test(cfg.url || "") && !!cfg.anonKey && !/PASTE/i.test(cfg.url + cfg.anonKey);
const TR = {excel:"Excel", sql:"SQL", pbi:"Power BI"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.querySelectorAll("[data-site]").forEach(el => { if (SITE[el.dataset.site]) el.textContent = SITE[el.dataset.site]; });
const out = document.getElementById("out");
async function fetchCert(id) {
  if (!configured) { try { const c = JSON.parse(localStorage.getItem("demo-db") || "{}")["certificates/" + id]; return c ? {name:c.name, track:c.track, level:c.level, issued_at:c.issuedAt} : null; } catch (e) { return null; } }
  const r = await fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/rpc/verify_certificate", {method:"POST", headers:{apikey:cfg.anonKey, "Content-Type":"application/json"}, body:JSON.stringify({cert_id:id})});
  if (!r.ok) throw new Error("The verification service didn't answer (" + r.status + ").");
  const rows = await r.json(); return rows[0] || null;
}
async function check(id) {
  id = (id || "").trim().toUpperCase(); if (!/^[A-Z0-9]{6,20}$/.test(id)) { out.innerHTML = ""; return; }
  out.innerHTML = `<p class="muted">Checking…</p>`;
  try {
    const c = await fetchCert(id);
    out.innerHTML = c ? `<div class="vcard ok"><b>Valid certificate</b><dl><dt>Issued to</dt><dd>${esc(c.name)}</dd><dt>Course</dt><dd>${esc(TR[c.track] || c.track)} · ${c.level === "advanced" ? "Advanced" : "Basic"} level</dd><dt>Date of issue</dt><dd>${esc(new Date(c.issued_at).toLocaleDateString("en-GB", {day:"2-digit", month:"long", year:"numeric"}))}</dd><dt>Certificate ID</dt><dd>${esc(id)}</dd></dl></div>`
      : `<div class="vcard bad"><b>No certificate found</b><p>Check the ID and try again. IDs are 10 characters, letters and digits.</p></div>`;
  } catch (e) { out.innerHTML = `<div class="vcard bad"><b>Couldn't check right now</b><p>${esc(e.message)}</p></div>`; }
}
const q = new URLSearchParams(location.search).get("id");
document.getElementById("vf").onsubmit = e => { e.preventDefault(); const v = document.getElementById("vid").value; history.replaceState(null, "", "?id=" + encodeURIComponent(v.trim().toUpperCase())); check(v); };
if (q) { document.getElementById("vid").value = q; check(q); }
</script>
</body>
</html>
